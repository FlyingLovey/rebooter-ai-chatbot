[project]
name = "aura-chatbot-backend"
version = "1.0.0"
description = "Rebooter AI chatbot backend: FastAPI + RAG (ChromaDB) + Vision + Guard"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.9",
    "chromadb>=1.0.0",
    "sentence-transformers>=3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
